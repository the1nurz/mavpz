<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:822px;height:542px;background:#FFFFFF;" width="822px" height="542px" viewBox="0 0 822 542" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="189.637" y="34.533" fill="#000" font-size="14" textLength="440.918" font-weight="700">Система — дві конкурентні спроби видачі UC-10 A4, SC-22, D40</text></g><ellipse cx="291.262" cy="63.609" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><path d="M438.695,83.609 L438.695,125.488 L418.695,129.488 L438.695,133.488 L438.695,175.367 A0,0 0 0 0 438.695,175.367 L801.193,175.367 A0,0 0 0 0 801.193,175.367 L801.193,93.609 L791.193,83.609 L438.695,83.609 A0,0 0 0 0 438.695,83.609" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M791.193,83.609 L791.193,93.609 L801.193,93.609 L791.193,83.609" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="444.695" y="102.104" fill="#000" font-size="13" textLength="305.068">Copy active, відкритих Loan немає, черга порожня.</text><text x="444.695" y="118.456" fill="#000" font-size="13" textLength="302.694">Кожен виклик виконує A02-A10 серверного потоку</text><text x="444.695" y="134.808" fill="#000" font-size="13" textLength="341.498">рівно один раз для вже поданого запиту, включно з A08.</text><text x="444.695" y="151.159" fill="#000" font-size="13" textLength="313.136">Завершення виклику означає серверний результат.</text><text x="444.695" y="167.511" fill="#000" font-size="13" textLength="307.918">Контекст D40 передбачає завершення обох спроб.</text><rect x="163.828" y="104.395" width="254.867" height="50.188" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="173.828" y="126.852" fill="#000" font-size="12" textLength="234.867">Прийняти два коректні конкурентні запити</text><text x="173.828" y="141.945" fill="#000" font-size="12" textLength="142.172">для R1 і R2 на один Copy</text><rect x="31.498" y="195.367" width="519.527" height="6" fill="#555" style="stroke:#555;stroke-width:1;" rx="2.5" ry="2.5"/><rect x="45.498" y="221.367" width="231.764" height="50.188" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><line x1="50.498" y1="221.367" x2="50.498" y2="271.555" style="stroke:#181818;stroke-width:0.5;"/><line x1="272.262" y1="221.367" x2="272.262" y2="271.555" style="stroke:#181818;stroke-width:0.5;"/><text x="55.498" y="243.824" fill="#000" font-size="12" textLength="211.764">Обробити запит R1 за A02-A10 UC-10</text><text x="55.498" y="258.918" fill="#000" font-size="12" textLength="107.525">та отримати result1</text><rect x="305.262" y="221.367" width="231.764" height="50.188" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><line x1="310.262" y1="221.367" x2="310.262" y2="271.555" style="stroke:#181818;stroke-width:0.5;"/><line x1="532.025" y1="221.367" x2="532.025" y2="271.555" style="stroke:#181818;stroke-width:0.5;"/><text x="315.262" y="243.824" fill="#000" font-size="12" textLength="211.764">Обробити запит R2 за A02-A10 UC-10</text><text x="315.262" y="258.918" fill="#000" font-size="12" textLength="107.525">та отримати result2</text><rect x="31.498" y="291.555" width="519.527" height="6" fill="#555" style="stroke:#555;stroke-width:1;" rx="2.5" ry="2.5"/><path d="M343.835,307.555 L343.835,366.609 L665.155,366.609 L665.155,317.555 L655.155,307.555 L343.835,307.555" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M655.155,307.555 L655.155,317.555 L665.155,317.555 L655.155,307.555" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="349.835" y="326.05" fill="#000" font-size="13" textLength="287.555">За інваріантом D40 допустимі лише ці дві пари.</text><text x="349.835" y="342.401" fill="#000" font-size="13" textLength="258.216">Один Copy має рівно один відкритий Loan.</text><text x="349.835" y="358.753" fill="#000" font-size="13" textLength="300.32">Join синхронізує серверні результати двох спроб.</text><polygon points="250.688,366.609,331.835,366.609,343.835,378.609,331.835,390.609,250.688,390.609,238.688,378.609,250.688,366.609" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="250.688" y="383.11" fill="#000" font-size="11" textLength="81.146">result1 — успіх?</text><text x="222.72" y="376.192" fill="#000" font-size="11" textLength="15.968">так</text><text x="343.835" y="376.192" fill="#000" font-size="11" textLength="8.519">ні</text><rect x="16" y="400.609" width="265.262" height="50.188" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="423.066" fill="#000" font-size="12" textLength="114.398">Завершити сценарій</text><text x="26" y="438.16" fill="#000" font-size="12" textLength="245.262">result1 — Loan.id, result2 — відкрита видача</text><rect x="301.262" y="400.609" width="265.262" height="50.188" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="311.262" y="423.066" fill="#000" font-size="12" textLength="114.398">Завершити сценарій</text><text x="311.262" y="438.16" fill="#000" font-size="12" textLength="245.262">result1 — відкрита видача, result2 — Loan.id</text><polygon points="291.262,456.797,303.262,468.797,291.262,480.797,279.262,468.797,291.262,456.797" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><ellipse cx="291.262" cy="511.797" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="291.262" cy="511.797" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="291.262" y1="73.609" x2="291.262" y2="104.395" style="stroke:#181818;stroke-width:1;"/><polygon points="287.262,94.395,291.262,104.395,295.262,94.395,291.262,98.395" fill="#181818" style="stroke:#18