<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:892px;height:472px;background:#FFFFFF;" width="892px" height="472px" viewBox="0 0 892 472" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="245.27" y="34.533" fill="#000" font-size="14" textLength="399.629" font-weight="700">Бібліотекар — спостереження результату UC-10, D33/D54</text></g><ellipse cx="280.226" cy="63.609" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><path d="M425.819,89.176 L425.819,114.703 L405.819,118.703 L425.819,122.703 L425.819,148.23 A0,0 0 0 0 425.819,148.23 L740.252,148.23 A0,0 0 0 0 740.252,148.23 L740.252,99.176 L730.252,89.176 L425.819,89.176 A0,0 0 0 0 425.819,89.176" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M730.252,89.176 L730.252,99.176 L740.252,99.176 L730.252,89.176" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="431.819" y="107.671" fill="#000" font-size="13" textLength="230.953">Контекст D33/D54 — дані зафіксовані.</text><text x="431.819" y="124.022" fill="#000" font-size="13" textLength="293.433">Спостереження активується від подання запиту.</text><text x="431.819" y="140.374" fill="#000" font-size="13" textLength="246.937">Клієнт може не знати результат фіксації.</text><rect x="154.632" y="93.609" width="251.188" height="50.188" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="164.632" y="116.066" fill="#000" font-size="12" textLength="231.188">Спостерігати результат поточного запиту</text><text x="164.632" y="131.16" fill="#000" font-size="12" textLength="112.418">через вебінтерфейс</text><path d="M433.974,158.23 L433.974,208.285 L413.974,212.285 L433.974,216.285 L433.974,266.34 A0,0 0 0 0 433.974,266.34 L792.694,266.34 A0,0 0 0 0 792.694,266.34 L792.694,168.23 L782.694,158.23 L433.974,158.23 A0,0 0 0 0 433.974,158.23" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M782.694,158.23 L782.694,168.23 L792.694,168.23 L782.694,158.23" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="439.974" y="176.726" fill="#000" font-size="13" textLength="206.432">Тригери одного AcceptEventAction</text><text x="439.974" y="193.077" fill="#000" font-size="13" textLength="236.571">SignalEvent — Підтвердження(Loan.id).</text><text x="439.974" y="209.429" fill="#000" font-size="13" textLength="265.104">TimeEvent — Тайм-аут очікування відповіді.</text><text x="439.974" y="225.78" fill="#000" font-size="13" textLength="250.479">Події стосуються лише поточного запиту.</text><text x="439.974" y="242.132" fill="#000" font-size="13" textLength="294.468">Прийняття першої події завершує це очікування.</text><text x="439.974" y="258.483" fill="#000" font-size="13" textLength="337.721">Тривалість тайм-ауту залишається питанням UC-10 X3.</text><polygon points="146.478,187.191,403.974,187.191,403.974,237.379,146.478,237.379,156.478,212.285" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="166.478" y="209.648" fill="#000" font-size="12" textLength="227.496">Прийняти першу подію поточного запиту</text><text x="166.478" y="224.742" fill="#000" font-size="12" textLength="215.332">Підтвердження(Loan.id) АБО Тайм-аут</text><polygon points="190.238,286.34,370.213,286.34,382.213,298.34,370.213,310.34,190.238,310.34,178.238,298.34,190.238,286.34" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="190.238" y="302.841" fill="#000" font-size="11" textLength="179.975">Прийнято Підтвердження(Loan.id)?</text><text x="162.27" y="295.923" fill="#000" font-size="11" textLength="15.968">так</text><text x="382.213" y="295.923" fill="#000" font-size="11" textLength="8.519">ні</text><rect x="16" y="320.34" width="243.43" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="342.797" fill="#000" font-size="12" textLength="223.43">Ознайомитися з підтвердженням видачі</text><ellipse cx="137.715" cy="401.434" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="137.715" cy="401.434" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><path d="M586.043,320.34 L586.043,354.043 L566.043,358.043 L586.043,362.043 L586.043,395.746 A0,0 0 0 0 586.043,395.746 L871.169,395.746 A0,0 0 0 0 871.169,395.746 L871.169,330.34 L861.169,320.34 L586.043,320.34 A0,0 0 0 0 586.043,320.34" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M861.169,320.34 L861.169,330.34 L871.169,330.34 L861.169,320.34" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="592.043" y="338.835" fill="#000" font-size="13" textLength="232.032">D54 — сервер уже зафіксував видачу.</text><text x="592.043" y="355.187" fill="#000" font-size="13" textLength="225.481">Тайм-аут залишає Loan збереженим.</text><text x="592.043" y="371.538" fill="#000" font-size="13" textLength="236.069">З'ясування результату й повтор запиту</text><text x="592.043" y="387.89" fill="#000" font-size="13" textLength="264.126">потребують окремого рішення за UC-10 X3.</text><rect x="279.43" y="332.949" width="286.613" height="50.188" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="289.43" y="355.406" fill="#000" font-size="12" textLength="266.613">Завершити спостереження після події Тайм-аут</text><text x="289.43" y="370.5" fill="#000" font-size="12" textLength="187.248">із невідомим клієнту результатом</text><ellipse cx="422.736" cy="441.746" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="422.736" cy="441.746" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="280.226" y1="73.609" x2="280.226" y2="93.609" style="stroke:#181818;stroke-width:1;